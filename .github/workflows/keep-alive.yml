name: Keep backend alive

# Render's free web service spins down after ~15 minutes of inactivity and then
# cold-starts (~50s) on the next request. Pinging every 10 minutes keeps it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          url="https://kabadiwala-backend-69wr.onrender.com/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url" || echo 000)
            echo "Attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 20
          done
          echo "Backend did not become healthy" >&2
          exit 1

  # Runs only on manual dispatch. Triggers a Render deploy when the repository
  # secret RENDER_DEPLOY_HOOK is configured; otherwise it is a no-op.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: ping
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
